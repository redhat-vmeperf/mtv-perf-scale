---
- name: Delete VM snapshots using govc
  hosts: localhost
  gather_facts: false
  collections:
    - containers.podman

  vars:
    GOVC_URL: "{{ vSphere_url }}"
    GOVC_USERNAME: "{{ lookup('env', 'vsphere_user') | default('administrator@vsphere.local', true) }}"
    GOVC_PASSWORD: "{{ lookup('env', 'vsphere_pw') }}"
    GOVC_INSECURE: "true"
    TempFolder: "{{ outPath }}"

  tasks:
    - name: Read VM names from file
      ansible.builtin.slurp:
        src: "{{ vm_names_file }}"
      register: vmnames_file

    - name: Set VM list variable
      set_fact:
        vm_names_list: "{{ (vmnames_file.content | b64decode).splitlines() | reject('equalto', '') | list }}"

    - name: Create output files
      shell: |
        > "{{ TempFolder }}"/esxlist.txt ;
        > "{{ TempFolder }}"/networklist.txt ;
        > "{{ TempFolder }}"/storagelist.txt

    - name: Build the mygovc image from Dockerfile
      ansible.builtin.shell: podman build -t localhost/mygovc:latest -f Dockerfile.govc .
      args:
        chdir: "{{ playbook_dir }}"

    - name: Pause for 3 seconds
      ansible.builtin.pause:
        seconds: 3

    - name: Remove stale govc_runner container if exists
      podman_container:
        name: govc_runner
        state: absent
      ignore_errors: true

    - name: Start govc container for efficient execution
      podman_container:
        name: govc_runner
        image: localhost/mygovc:latest
        state: started
        env:
          GOVC_URL: "{{ GOVC_URL }}"
          GOVC_USERNAME: "{{ GOVC_USERNAME }}"
          GOVC_PASSWORD: "{{ GOVC_PASSWORD }}"
          GOVC_INSECURE: "{{ GOVC_INSECURE }}"

    - name: Pause for 3 seconds
      ansible.builtin.pause:
        seconds: 3          

    - name: Collect Network, DataStore and Host for each VM
      shell: |
        podman exec govc_runner govc vm.info -json '{{ item }}' | jq -r '.virtualMachines[0] as $VM | ($VM.config.hardware.device[] | select(.deviceInfo.label | test("Network"; "i")) | .deviceInfo.summary) as $NETWORK_NAME | ($VM.network[]?.value) as $NETWORK_ID | "\( $NETWORK_ID ) \( $NETWORK_NAME )"' >> "{{ TempFolder }}"/networklist.txt ;
        podman exec govc_runner govc vm.info -json '{{ item }}' | jq -r '.virtualMachines[0] as $VM | [ ($VM.datastore[]? // empty | .value),($VM.config.files.vmPathName | capture("\\[(?<logical_name>[^\\]]+)\\]").logical_name) ] | join (" ")' >> "{{ TempFolder }}"/storagelist.txt ;
        podman exec govc_runner govc vm.info '{{ item }}' | grep Host | awk '{print $2}'  >> "{{ TempFolder }}"/esxlist.txt
      loop: "{{ vm_names_list }}"
      register: snapshot_info
      ignore_errors: true
      loop_control:
        pause: 1

    - name: Stop govc container
      podman_container:
        name: govc_runner
        state: absent

    - name: Pause for 3 seconds
      ansible.builtin.pause:
        seconds: 3

    - name: Remove mygovc image
      podman_image:
        name: localhost/mygovc
        tag: latest
        state: absent

    - name: Create sort and unique output files
      shell: |
        cat "{{ TempFolder }}"/esxlist.txt | sort -u > "{{ TempFolder }}"/sort_esxlist.txt && mv "{{ TempFolder }}"/sort_esxlist.txt "{{ TempFolder }}"/esxlist.txt ;
        cat "{{ TempFolder }}"/networklist.txt | sort -u > "{{ TempFolder }}"/sort_networklist.txt && mv "{{ TempFolder }}"/sort_networklist.txt "{{ TempFolder }}"/networklist.txt ;
        cat "{{ TempFolder }}"/storagelist.txt | sort -u > "{{ TempFolder }}"/sort_storagelist.txt && mv "{{ TempFolder }}"/sort_storagelist.txt "{{ TempFolder }}"/storagelist.txt 

